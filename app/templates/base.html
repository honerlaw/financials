<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financials</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8fafc; }
    .navbar-brand { color: #60a5fa !important; font-weight: 700; }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
{% if session.get('authenticated') %}
<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="/">Financials</a>
  <div class="d-flex align-items-center gap-3">
    <a href="/" class="text-secondary text-decoration-none">Transactions</a>
    <a href="/subscriptions" class="text-secondary text-decoration-none">Subscriptions</a>
    <a href="/bills" class="text-secondary text-decoration-none">Bills</a>
    <a href="/chat" class="text-secondary text-decoration-none">Chat</a>
    <small id="sync-label" class="text-secondary"></small>
    <button id="sync-btn" class="btn btn-sm btn-primary" onclick="triggerSync(this)">Sync now</button>
    <a href="/settings" class="text-secondary text-decoration-none fs-5">⚙</a>
  </div>
</nav>
{% endif %}
<div class="{% block container_class %}container-fluid py-4 px-4{% endblock %}">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function triggerSync(btn) {
  btn.disabled = true;
  btn.textContent = 'Syncing...';
  try {
    await fetch('/api/sync', { method: 'POST' });
    setTimeout(() => location.reload(), 10000);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Sync now';
  }
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
