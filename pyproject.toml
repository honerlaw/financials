# Dependencies for the financials app, managed with uv.
#
# `uv.lock` pins the exact set production installs: the Dockerfile runs
# `uv sync --locked --no-dev`, which fails the build if this file and the lock
# disagree instead of re-resolving. A bound here is a ceiling for `uv lock`, not
# what gets installed — bump a package with `uv lock --upgrade-package <name>`.
# See CLAUDE.md § Development.

[project]
name = "financials"
version = "0.0.0"
# The production image is python:3.12-slim; lock and develop against 3.12 only.
requires-python = ">=3.12,<3.13"
dependencies = [
    "plaid-python>=26.0.0",
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    # Pinned below 2.1, which made psycopg (v3) the default driver for
    # postgresql:// URLs; this image installs only psycopg2-binary, and an
    # unpinned build resolving 2.1.4 crashed the container at create_app. The
    # suite runs on SQLite, so it cannot vouch for Postgres behaviour under 2.1
    # either — moving to 2.1 / psycopg 3 is its own change.
    "SQLAlchemy>=2.0,<2.1",
    "flask-migrate>=4.0.0",
    "APScheduler>=3.10.0",
    # zoneinfo's IANA database — the python:3.12-slim base image is not
    # guaranteed to carry system tzdata, and APP_TIMEZONE lookups must not fall
    # over in the container.
    "tzdata>=2024.1",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=21.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "twilio>=9.0.0",
]

[dependency-groups]
# Test tooling: installed by `uv sync` locally, left out of the production
# image (`--no-dev`).
dev = [
    "pytest>=8.0.0",
    "pytest-flask>=1.3.0",
    "freezegun>=1.4.0",
]

[tool.uv]
# The app runs from the source tree; it is never built or installed as a package.
package = false
